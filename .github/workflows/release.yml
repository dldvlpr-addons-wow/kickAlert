name: CI

# Chaque push et pull request lance tests/run.sh. Pousser un tag (ex. 1.2.0) lance
# en plus, si les tests passent, le packager BigWigs : zip publié sur CurseForge,
# Wago et en release GitHub.
# Secrets du dépôt : CF_API_KEY, WAGO_API_TOKEN (GITHUB_TOKEN est fourni).
# Identifiants de projet dans le .toc : ## X-Curse-Project-ID et ## X-Wago-ID.
# Une plateforme sans secret ou sans identifiant est ignorée.

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y lua5.1

      - run: bash tests/run.sh

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
